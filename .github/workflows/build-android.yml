name: Build Android APK

# Runs entirely on GitHub's own servers — nothing installs on your laptop.
# Trigger it manually from the Actions tab, or just by pushing to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web app dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Set up Java (needed for the Android/Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync the web build into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: xenvia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
